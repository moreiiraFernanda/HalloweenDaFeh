        .container {

            margin: auto;
        }

        section {

        .hero {

            align-items: center;

        }

        .subtitle {
            font-size: 18px;

            margin: auto;
        }

        .date {
            margin-top: 35px;
            font-size: 18px;
            letter-spacing: 2px;

        .gold {

        .text {
            max-width: 700px;
            margin: auto;

        }

        .info {
            display: grid;
            gap: 15px;
            margin-top: 30px;
        }

        .info div {
            padding: 18px;
            border-left: 2px solid #b99a61;
            background: rgba(255,255,255,0.025);
        }

        .dress-code {
            margin-top: 30px;
            font-size: 18px;
        }

        .dress-code span {
            display: inline-block;
            margin: 6px;
            padding: 8px 14px;
            border: 1px solid rgba(185,154,97,0.5);
        }

        .rules {
            list-style: none;
            margin-top: 25px;
        }

        .rules li {
            margin: 15px 0;
            padding-left: 25px;
        }

        .rules li::before {
            content: "✦";
            color: #b99a61;
            margin-right: 10px;
        }

        #countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 35px;
        }

        .time-box {
            padding: 20px 10px;
            border: 1px solid rgba(185,154,97,0.4);
        }

        .time-box strong {
            display: block;
            font-size: 30px;
            color: #d8c19a;
        }

        .time-box small {
            color: #a99b88;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            border: 1px solid #b99a61;
            color: #d8c19a;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: #b99a61;
            color: #120d13;
        }
