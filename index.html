<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
O Coven Medieval — III Halloween da Fêh
</title>


<style>

/* =========================
   CONFIGURAÇÃO GERAL
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    background-color: #e6d0a5;

    color: #35251d;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    line-height: 1.7;
}


/* =========================
   EFEITO DE PERGAMINHO
========================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.25;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(80,40,20,0.08) 0px,
            rgba(80,40,20,0.08) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 20;
}


/* =========================
   CONTAINER
========================= */

.container {

    width: 90%;

    max-width: 850px;

    margin: auto;

}


/* =========================
   SEÇÕES
========================= */

section {

    padding: 75px 0;

    position: relative;

}


/* =========================
   ABERTURA
========================= */

.hero {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;

}


.hero-box {

    width: 100%;

    max-width: 760px;

    padding: 60px 30px;

    background-color:
        rgba(239, 220, 177, 0.92);

    border:
        3px double #70403b;

    outline:
        1px solid #70403b;

    outline-offset:
        8px;

    box-shadow:
        0 12px 35px
        rgba(60,30,15,0.25);

}


/* =========================
   SÍMBOLOS
========================= */

.symbol {

    color: #62364f;

    font-size: 40px;

    letter-spacing: 8px;

}


/* =========================
   TÍTULO
========================= */

.edition {

    margin-top: 15px;

    color: #704b2c;

    font-size: 13px;

    letter-spacing: 5px;

    text-transform: uppercase;

}


h1 {

    margin: 20px 0;

    color: #542c49;

    font-size:
        clamp(42px, 9vw, 75px);

    font-weight: normal;

    line-height: 1.05;

}


.subtitle {

    font-size: 19px;

    font-style: italic;

    color: #4c352d;

}


.date {

    margin-top: 30px;

    color: #704b2c;

    font-size: 19px;

    letter-spacing: 2px;

    font-weight: bold;

}


/* =========================
   TÍTULOS DAS SEÇÕES
========================= */

h2 {

    margin-bottom: 35px;

    text-align: center;

    color: #5c304e;

    font-size: 34px;

    font-weight: normal;

}


h2::before {

    content:
        "☾  ✦  ☽";

    display: block;

    margin-bottom: 10px;

    color: #805b2f;

    font-size: 21px;

}


/* =========================
   TEXTO
========================= */

.text {

    max-width: 700px;

    margin: auto;

    text-align: center;

    font-size: 17px;

}


.gold {

    color: #704b24;

    font-weight: bold;

}


/* =========================
   DIVISÓRIA
========================= */

.divider {

    margin: 25px auto;

    text-align: center;

    color: #79512d;

    font-size: 22px;

}


/* =========================
   CARDS
========================= */

.card {

    max-width: 720px;

    margin: 25px auto;

    padding: 28px;

    background-color:
        rgba(246, 231, 198, 0.75);

    border:
        1px solid #8b6846;

    box-shadow:
        0 8px 20px
        rgba(60,30,15,0.12);

}


/* =========================
   INFORMAÇÕES
========================= */

.info {

    display: grid;

    gap: 15px;

}


.info-item {

    padding: 18px;

    background-color:
        rgba(255,248,228,0.65);

    border-left:
        4px solid #683944;

}


.info-item strong {

    color: #5c304e;

}


/* =========================
   DRESS CODE
========================= */

.dress {

    max-width: 720px;

    margin: 30px auto;

    text-align: center;

}
