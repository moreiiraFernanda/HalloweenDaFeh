<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>O Coven Medieval — III Halloween da Fêh</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(circle at 20% 10%, rgba(126, 75, 45, .18), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(78, 38, 73, .20), transparent 35%),
        #e7d2aa;

    color: #35251d;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    line-height: 1.7;
}


/* =========================
   FUNDO DE PERGAMINHO
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(80, 50, 25, .025),
            rgba(80, 50, 25, .025) 2px,
            transparent 2px,
            transparent 5px
        );

    z-index: 10;
}


/* =========================
   CONTAINER
========================= */

.container {
    width: 90%;
    max-width: 850px;
    margin: auto;
}


/* =========================
   SEÇÕES
========================= */

section {
    padding: 75px 0;
    position: relative;
}


/* =========================
   ABERTURA
========================= */

.hero {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        linear-gradient(
            rgba(231, 210, 170, .82),
            rgba(231, 210, 170, .92)
        );

    border-bottom:
        8px double #6b3b38;
}

.hero-content {
    padding: 45px 25px;

    border:
        2px solid #765039;

    outline:
        1px solid #765039;

    outline-offset: 8px;

    box-shadow:
        0 0 30px rgba(80, 45, 25, .20);
}


.symbol {
    font-size: 48px;
    color: #592d4e;

    margin-bottom: 15px;
}


.edition {
    font-size: 13px;

    letter-spacing: 5px;

    text-transform: uppercase;

    color: #79502d;

    margin-bottom: 20px;
}


h1 {
    font-size: clamp(42px, 9vw, 76px);

    font-weight: normal;

    line-height: 1.05;

    color: #542d48;

    margin-bottom: 25px;
}


.subtitle {
    font-size: 19px;

    font-style: italic;

    color: #50372d;

    max-width: 650px;

    margin: auto;
}


.date {
    margin-top: 35px;

    font-size: 19px;

    letter-spacing: 2px;
}


.gold {
    color: #765024;

    font-weight: bold;
}


/* =========================
   TÍTULOS
========================= */

h2 {
    text-align: center;

    font-size: 34px;

    font-weight: normal;

    color: #592d4e;

    margin-bottom: 35px;
}

h2::before {
    content: "☾  ✦  ☽";

    display: block;

    font-size: 20px;

    color: #79502d;

    margin-bottom: 10px;
}


/* =========================
   TEXTO
========================= */

.text {
    max-width: 700px;

    margin: auto;

    text-align: center;

    font-size: 17px;
}


/* =========================
   CARDS
========================= */

.card {
    max-width: 700px;

    margin: 30px auto 0;

    padding: 30px;

    background:
        rgba(255, 247, 226, .55);

    border:
        1px solid #8b6745;

    box-shadow:
        0 8px 20px rgba(70, 40, 20, .12);
}


/* =========================
   INFORMAÇÕES
========================= */

.info {
    display: grid;

    gap: 15px;
}


.info div {
    padding: 18px;

    background:
        rgba(255, 250, 235, .55);

    border-left:
        4px solid #6b3b38;
}


.info strong {
    color: #592d4e;
}


/* =========================
   DRESS CODE
========================= */

.dress-code {
    max-width: 700px;

    margin: 35px auto 0;

    text-align: center;
}


.dress-code span {
    display: inline-block;

    margin: 6px;

    padding: 9px 15px;

    border:
        1px solid #806043;

    background:
        rgba(255, 247, 226, .45);

    color: #50352c;
}
